<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Note Walker</title>
<meta name="description" content="Note Walker is a rhythm-reading game for music class, for iPhone and iPad.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { color-scheme: light dark; --paper: #F7F4EE; --ink: #1A2242; --muted: #5B6178; --accent: #F5A623; --accent-deep: #C77C00; }
@media (prefers-color-scheme: dark) { :root { --paper: #0D1121; --ink: #EEF0F7; --muted: #A3A9BE; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, sans-serif; }
main {
  min-height: 100vh; max-width: 560px; margin: 0 auto; display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center;
  padding: calc(32px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
}
.icon { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 14px 30px -14px rgba(16, 24, 60, .55); }
.by { margin: 8px 0 0; font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: 2.4rem; line-height: 1.05; }
h1 span { color: var(--accent-deep); }
p { margin: 0; color: var(--muted); max-width: 38ch; }
.get {
  margin-top: 8px; display: inline-block; padding: 14px 26px; border-radius: 14px; text-decoration: none; font-weight: 700;
  background: var(--accent); color: #2B1A00; box-shadow: 0 5px 0 var(--accent-deep);
}
.get:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-deep); }
.small { font-size: .9rem; }
.links { margin-top: 18px; font-size: .9rem; }
.links a { color: inherit; }
</style>
</head>
<body>
<main>
  <img class="icon" src="app-icon.png" alt="The Note Walker app icon: the walker in a top hat stepping along a staff">
  <p class="by">Mansfield Games</p>
  <h1>Note <span>Walker</span></h1>
  <p>Read the rhythm, tap each note, and keep the walker on their feet. Note Walker is now an app for iPhone and iPad.</p>
  <a class="get" href="https://apps.apple.com/app/id6836165032">Get it on the App Store</a>
  <p class="links"><a href="support.html">Help &amp; support</a> &middot; <a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
