<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script>
// Draws the app icon: the walker from the game, mid-stride on a staff, with a beamed pair of notes.
// make_icons.py renders this with headless Chrome. ?v=a|b|c picks a version.
const v = new URLSearchParams(location.search).get('v') || 'a';
const c = document.getElementById('c').getContext('2d');
const W = 1024;
const MARIGOLD = '#F5A623', DEEP = '#C77C00', NAVY = '#1A2242', SKIN = '#F1C09A';
const night = v !== 'b';
const C = {
  bg: night ? NAVY : MARIGOLD,
  line: night ? 'rgba(233,237,250,.22)' : 'rgba(26,34,66,.28)',
  note: night ? MARIGOLD : NAVY,
  hat: night ? '#E9EDFA' : NAVY,
  outline: night ? '#070A16' : NAVY,
  jacket: night ? MARIGOLD : '#FFFFFF',
  jacketDeep: night ? DEEP : '#C9CEDF',
  band: night ? MARIGOLD : MARIGOLD,
};
// background with a soft glow behind the walker
c.fillStyle = C.bg; c.fillRect(0, 0, W, W);
const g = c.createRadialGradient(W * .42, W * .45, 0, W * .42, W * .45, W * .6);
g.addColorStop(0, night ? 'rgba(80,100,170,.45)' : 'rgba(255,230,170,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
c.fillStyle = g; c.fillRect(0, 0, W, W);

const S = v === 'c' ? 128 : 96;
const feetY = v === 'c' ? 900 : 790;
const x = v === 'c' ? 512 : 380;

// staff lines; the walker stands on the bottom one
if (v !== 'c') {
  c.fillStyle = C.line;
  for (let i = 0; i < 5; i++) c.fillRect(0, feetY - i * 62 - 6, W, 12);
}

// a beamed pair of eighth notes, ahead of the walker
if (v !== 'c') {
  c.save(); c.fillStyle = C.note;
  const heads = [[680, feetY - 2 * 62], [850, feetY - 3 * 62]];
  for (const [hx, hy] of heads) { c.beginPath(); c.ellipse(hx, hy, 56, 40, -.35, 0, Math.PI * 2); c.fill(); }
  const sx1 = 680 + 44, sx2 = 850 + 44, top1 = feetY - 2 * 62 - 330, top2 = feetY - 3 * 62 - 330;
  c.fillRect(sx1 - 10, top1, 20, feetY - 2 * 62 - top1 - 8);
  c.fillRect(sx2 - 10, top2, 20, feetY - 3 * 62 - top2 - 8);
  c.beginPath(); c.moveTo(sx1 - 10, top1); c.lineTo(sx2 + 10, top2); c.lineTo(sx2 + 10, top2 + 56); c.lineTo(sx1 - 10, top1 + 56); c.closePath(); c.fill();
  c.restore();
}

// the walker: same shapes as drawAvatar() in the game, frozen mid-step and smiling
const yb = feetY, swing = -.42;   // back leg left, front leg right
const hipY = yb - 1.65 * S, legL = 1.65 * S, ol = .11 * S;
c.lineCap = 'round'; c.lineJoin = 'round';
c.strokeStyle = C.hat; c.fillStyle = C.hat; c.lineWidth = .34 * S;
for (const [dx, a] of [[-.28, swing], [.28, -swing]]) {
  const fx = x + dx * S + Math.sin(a) * legL, fy = hipY + Math.cos(a) * legL;
  c.beginPath(); c.moveTo(x + dx * S, hipY); c.lineTo(fx, fy); c.stroke();
  c.beginPath(); c.ellipse(fx + .18 * S, fy - .05 * S, .32 * S, .17 * S, 0, 0, Math.PI * 2); c.fill();
}
const shY = yb - 3.15 * S;
for (const pass of [0, 1]) for (const side of [-1, 1]) {
  c.strokeStyle = pass ? SKIN : C.outline; c.lineWidth = .28 * S + (pass ? 0 : ol * 2);
  const sx = x + side * .72 * S;
  const ex = sx + side * .2 * S + Math.sin(side * .42) * .55 * S, ey = yb - 1.95 * S;
  c.beginPath(); c.moveTo(sx, shY); c.lineTo(ex, ey); c.stroke();
}
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
c.fillStyle = C.jacket; rr(x - .8 * S, yb - 3.6 * S, 1.6 * S, 2.1 * S, .5 * S); c.fill();
c.strokeStyle = C.outline; c.lineWidth = ol; c.stroke();
c.fillStyle = C.jacketDeep;
c.beginPath(); c.arc(x + .1 * S, yb - 2.95 * S, .1 * S, 0, Math.PI * 2); c.arc(x + .1 * S, yb - 2.35 * S, .1 * S, 0, Math.PI * 2); c.fill();
const hy = yb - 4.55 * S;
c.fillStyle = SKIN; c.beginPath(); c.arc(x, hy, .9 * S, 0, Math.PI * 2); c.fill(); c.strokeStyle = C.outline; c.lineWidth = ol; c.stroke();
c.fillStyle = NAVY; c.strokeStyle = NAVY;
c.beginPath(); c.arc(x + .2 * S, hy - .12 * S, .1 * S, 0, Math.PI * 2); c.arc(x + .55 * S, hy - .12 * S, .1 * S, 0, Math.PI * 2); c.fill();
c.lineWidth = .1 * S; c.beginPath(); c.arc(x + .4 * S, hy + .15 * S, .24 * S, Math.PI * .15, Math.PI * .85); c.stroke();
c.fillStyle = C.hat;
c.fillRect(x - .62 * S, hy - 2.05 * S, 1.24 * S, 1.25 * S);
c.fillRect(x - .98 * S, hy - .9 * S, 1.96 * S, .22 * S);
c.fillStyle = C.band; c.fillRect(x - .62 * S, hy - 1.15 * S, 1.24 * S, .25 * S);
document.title = 'done';
</script></body></html>
